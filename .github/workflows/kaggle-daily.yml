name: Daily Kaggle competition report

on:
  schedule:
    - cron: '15 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kaggle-daily-report
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Kaggle token
        run: |
          if [ -z "$KAGGLE_API_TOKEN" ]; then
            echo '::error::Set KAGGLE_API_TOKEN in repository Settings > Secrets and variables > Actions.'
            exit 1
          fi
      - name: Fetch open competitions
        run: |
          python -m pip install 'kaggle>=1.7,<2'
          python -m unittest discover -s tests -p 'test_kaggle_report.py'
          python scripts/update_kaggle.py
      - name: Commit public report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/kaggle-active.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh Kaggle competition report'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
