name: Daily Tianchi competition report

on:
  schedule:
    - cron: '35 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tianchi-daily-report
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch official active listing and check dates
        run: |
          python -m unittest discover -s tests -p 'test_tianchi_report.py'
          python scripts/update_tianchi.py
      - name: Commit public report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/tianchi-active.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh Tianchi competition report'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
